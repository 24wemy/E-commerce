# /etc/nginx/sites-available/freshminut  (ganti domainanda.com)
# Cloudflare (Proxied, SSL Full Strict) -> Nginx :443 (Origin Certificate) -> Next.js :3000

# Hanya izinkan IP Cloudflare mengakses origin (opsional tapi disarankan, lihat DEPLOYMENT.md §5)
# include /etc/nginx/cloudflare-allow.conf;

server {
    listen 80;
    server_name domainanda.com www.domainanda.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name domainanda.com www.domainanda.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;
    server_tokens off;

    # IP asli pengunjung dari Cloudflare
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
